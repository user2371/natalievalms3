<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Стандартна аватарка">
  <!-- Фон — м'який кремовий, той самий, що фон карток/сторінок (color: cream-soft) -->
  <rect width="600" height="600" fill="#f8ece5" />

  <!-- Декоративне м'яке коло на фоні (color: accent-soft), для глибини без зайвих деталей -->
  <circle cx="300" cy="300" r="270" fill="#f0d9cf" />

  <!-- Тонке зовнішнє кільце (color: rose-line) — той самий бордер-колір, що в картках/аватарках по всьому додатку -->
  <circle cx="300" cy="300" r="270" fill="none" stroke="#e8c3b6" stroke-width="3" />

  <!-- Мінімалістичний силует: голова -->
  <circle cx="300" cy="235" r="88" fill="#c17b68" />

  <!-- Мінімалістичний силует: плечі (обрізаються нижнім краєм — коректно і для круглого, і для 4:5 кадрування) -->
  <path
    d="M300 345
       C 405 345 478 428 478 600
       L 122 600
       C 122 428 195 345 300 345
       Z"
    fill="#c17b68"
  />

  <!-- Легкий акцент-обвідка навколо голови (color: accent-dark) — додає трохи глибини, лишаючись плоским/мінімалістичним -->
  <circle cx="300" cy="235" r="88" fill="none" stroke="#a85f4f" stroke-width="4" opacity="0.35" />
</svg>
